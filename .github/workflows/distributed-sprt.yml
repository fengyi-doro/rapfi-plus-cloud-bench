name: Distributed Rapfi SPRT
run-name: F23 frozen AVX2 build · mask ${{ inputs.mask }}
on:
  workflow_dispatch:
    inputs:
      mask:
        type: string
        description: "screen builds the five single-module arms, or supply a selected decimal mask"
        default: screen
        required: true
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  CUDA_VISIBLE_DEVICES: "-1"
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        id: frozen
        continue-on-error: true
        with:
          name: engines-linux
          path: historical
          github-token: ${{ github.token }}
          run-id: 45832263308
      - if: steps.frozen.outcome != 'success'
        uses: actions/checkout@v4
        with:
          ref: 9f4858626bffebc1d9e47de243c304bb69180108
          path: frozen
      - uses: actions/cache@v4
        with:
          path: build/linux-v4
          key: f23-shared-zig0141-v1-${{ hashFiles('src_plus/**', 'build.py', 'scripts/build_v3.py') }}
      - run: python -m pip install ziglang==0.14.1
      - name: Build and fingerprint candidates against the two historical engines
        env:
          MASK: ${{ inputs.mask }}
        run: |
          test "$(git rev-parse HEAD:src_orig)" = 5a506c21eda356315d2cfb650db0332dcc760b2f
          test "$(git rev-parse HEAD:data/runtime_files.json)" = 1a980665618ad0ff03a912bede98a56ae7efdc67
          test "$(git rev-parse HEAD:data/v3/cloud_openings.json)" = 10d9933c22ed7bbb81d7593b3eec7d52a03e0740
          if [[ "$MASK" == screen ]]; then
            python scripts/f23_build.py 1 2 4 8 16
          else
            python scripts/f23_build.py "$MASK"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: f23-engines
          path: dist/
          if-no-files-found: error
          retention-days: 90

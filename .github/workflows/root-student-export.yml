name: Verify global root student precision
run-name: Compare B24 student FP32, S8S8 and U8U8 on held-out validation positions
on:
  workflow_dispatch:
  push:
    branches: [experiments/cpu-root-search]
    paths: ['.github/workflows/root-student-export.yml']

permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-24.04
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.6 onnx==1.18.0 onnxruntime==1.22.1
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45834059076
          name: training-input
          path: training-input
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45834059076
          pattern: labels-*
          merge-multiple: true
          path: labels
      - run: python scripts/cloud_distill.py train --compare-precision --out oracle-dist
      - uses: actions/upload-artifact@v4
        with:
          name: katagomo-distilled-cpu
          path: oracle-dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: training-summary
          path: oracle-dist/oracle.json
          if-no-files-found: error
          retention-days: 30

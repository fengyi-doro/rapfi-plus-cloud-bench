name: Paired root search cost
on:
  workflow_dispatch:
    inputs:
      match_runs:
        description: JSON array of completed thousand-game match run IDs
        type: string
        default: '[45829186705,45829526044,45829849427,45831072173,45831719577]'
  push:
    branches: [experiments/cpu-root-search]
    paths: ['.github/workflows/root-costs.yml', 'scripts/root_cost_probe.py']
permissions:
  contents: read
  actions: read
jobs:
  cost:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        run: ${{ fromJSON(inputs.match_runs || '[45829186705,45829526044,45829849427,45831072173,45831719577]') }}
    env:
      MATCH_RUN: ${{ matrix.run }}
      RAPFI_BUILD_PROFILE: v4
      RAPFI_ARENA_BIN: dist
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/root_cost_probe.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.run }}
          name: pentanomial-elo-los-sprt
          path: input
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: identity
        name: Read the exact match revision and active root model
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('input/summary.json').read_bytes())['protocol']
          assert p['build_profile'] == 'v4'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print('sha=' + p['commit'], file=f)
              print('mode=' + p['root_mode'], file=f)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              print('RAPFI_CANDIDATE_LABEL=' + p['players'][0], file=f)
              print('RAPFI_ORACLE_FAMILY=' + (p.get('oracle_family') or 'b24'), file=f)
              print('RAPFI_ORACLE_USAGE=' + (p.get('oracle_usage') or 'broad'), file=f)
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.identity.outputs.sha }}
          path: engine-src
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /data/positions.json
            /config.toml
            /*.bin
            /*.lz4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.run }}
          name: engines-linux
          path: engine-src/dist
      - if: steps.identity.outputs.mode == 'kata'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.run }}
          name: katagomo-cpu
          path: engine-src/dist
      - run: python -m pip install psutil==7.0.0
      - if: steps.identity.outputs.mode == 'kata'
        run: python -m pip install numpy==2.2.6 onnxruntime==1.22.1
      - working-directory: engine-src
        run: |
          (cd dist && sha256sum -c SHA256SUMS && chmod +x pbrain-rapfi-*)
          python ../driver/scripts/root_cost_probe.py ../input/summary.json ../measurements/root-cost.json
      - uses: actions/upload-artifact@v4
        with:
          name: root-cost-${{ matrix.run }}
          path: measurements/root-cost.json
          retention-days: 14
